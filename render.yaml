services:
  - type: web
    name: dreamverse
    runtime: python
    # Free slaapt na een kwartier en de eerste bezoeker wacht dan een halve
    # minuut. Prima om te bouwen; zet op starter zodra je hem laat zien.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # Render injecteert PORT zelf. HOST moet de externe interface zijn -
      # loopback antwoordt niets van buiten de container.
      - key: HOST
        value: 0.0.0.0
      # Zet deze in het Render-dashboard, niet hier.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASSWORD
        sync: false
    # Let op: het archief staat als bestand op de schijf van de container en
    # is bij elke deploy weg. Voor iets echts hoort hier een database.
