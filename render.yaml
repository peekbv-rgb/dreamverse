services:
  - type: web
    name: dreamverse
    runtime: python
    # Starter en niet free: free slaapt na een kwartier, en de eerste bezoeker
    # daarna wacht een halve tot een hele minuut op een leeg scherm. Met
    # testpersonen meet je dan hun geduld in plaats van je product.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py

    # DE SCHIJF STAAT BEWUST NIET IN DIT BESTAND.
    #
    # Hij is met de hand in het dashboard aangemaakt en gekoppeld op
    # /opt/render/project/src/data. Zou hier een schijf met een andere naam
    # staan, dan kan Render bij het synchroniseren besluiten de bestaande te
    # vervangen - en daar staan de database, de dromen, de panelen en de video's
    # op. Dat risico is het niet waard.
    #
    # Zonder die schijf is alles weg bij elke deploy, inclusief de accounts van
    # je testpersonen. Haal hem dus nooit weg, en controleer na een verhuizing
    # of hij er nog hangt.

    envVars:
      # Render injecteert PORT zelf. HOST moet de externe interface zijn -
      # loopback antwoordt niets van buiten de container.
      - key: HOST
        value: 0.0.0.0

      # Vera's personage-id is geen geheim; het staat ook in CLAUDE.md.
      - key: RUNWAY_CHARACTER_ID
        value: 43e6b2b0-29ea-4125-8e2f-3ebed04f65d1

      # Vijf minuten per gesprek.
      - key: VERA_MAX_DURATION
        value: "300"

      # E-mailverificatie eisen bij het aanmaken van een account. Uit zolang er
      # geen SMTP is: een bevestigingsmail die niet aankomt houdt iedereen buiten.
      - key: VERIFICATIE_NODIG
        value: "0"

      # ----------------------------------------------------------------- #
      # Alles hieronder zet je met de hand in het Render-dashboard onder
      # Environment. Ze staan hier bewust alleen als naam: sync: false betekent
      # dat Render de waarde bewaart en dat dit bestand hem nooit ziet.
      # ----------------------------------------------------------------- #

      # Het schrijven, het beeld en de avatar.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false

      # Pakket en tokensaldo met de hand kunnen zetten. Leeg laten betekent: kan
      # helemaal niet, en dat is de veilige stand.
      - key: ADMIN_TOKEN
        sync: false

      # ----------------------------------------------------------------- #
      # Afrekenen via Stripe Managed Payments.
      # ----------------------------------------------------------------- #

      # De geheime sleutel. Sandbox begint met sk_test_, live met sk_live_.
      - key: STRIPE_SECRET_KEY
        sync: false

      # Het geheim van de webhook, uit het Stripe-dashboard bij Webhooks. Zonder
      # dit weigert de server elke melding - je kunt dan wel betalen, maar je
      # pakket slaat niet om. Dat is de veilige stand: de handtekening is het
      # enige bewijs dat een betaling echt van Stripe komt.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Waar Stripe de klant naartoe terugstuurt. De https-url van deze service,
      # zonder schuine streep aan het eind.
      - key: PUBLIEKE_URL
        sync: false

      # De prijzen, uit: python betalen.py --setup. Sandbox en live hebben
      # verschillende id's, dus die van je sandbox werken hier niet als je
      # overstapt.
      - key: STRIPE_PRICE_LITE
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_ULTRA
        sync: false
      - key: STRIPE_PRICE_TOKENS20
        sync: false
      - key: STRIPE_PRICE_TOKENS40
        sync: false
      - key: STRIPE_PRICE_TOKENS100
        sync: false

      # ----------------------------------------------------------------- #
      # Basic auth over de hele app. Sinds er accounts zijn hoeft dit niet meer
      # om je tegoed te beschermen - zonder inloggen komt niemand bij /api of
      # /panels. Laat ze leeg als je testpersonen uitnodigt: een extra
      # wachtwoordvenster vóór de inlogpagina kost je mensen.
      #
      # Vul ze wél als je de app nog even helemaal dicht wilt houden.
      # ----------------------------------------------------------------- #
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASSWORD
        sync: false
